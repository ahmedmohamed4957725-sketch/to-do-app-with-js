<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="app">
        <header id="hd">
            <h1>To-Do List App</h1>
            <div id="sorting_form__div">
            <input type="search" id="search_input" placeholder="Search">
            <div id="filter__div">
                    <button class="filter__Btn"  value="all"><span id="task_count_all"></span>All</button>
                    <button class="filter__Btn" value="pending"><span id="task_count_pending"></span>Pending</button>
                    <button class="filter__Btn" value="completed"><span id="task_count_completed"></span>Completed</button>
            </div>
            </div>
        </header> 

        <main id="main">
            <section id="add_task_form">
            <form id="addTaskForm">
                <input type="text" id="task_title" placeholder="Title">
                <input type="text" id="task_description" placeholder="Description (Optional)">
                <input type="datetime-local" id="taskDueDate" placeholder="Due Date">
                <button type="submit" id="submit_button" >Add</button>
                <div id="error_message"></div>
            </form>
            </section>
            <section id="task_list">
                <ul id="task_list_ul">                  
                </ul>
            </section>
        </main>

        <footer id="ft">
            <p>&copy; 2023 To-Do List App. All rights reserved.</p>
            
        </footer>

    </div>
    
    <script src="./js/script.js"></script>
</body>
</html>
